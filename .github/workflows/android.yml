# NOTE: this file is a local mirror. The GitHub App used for pushes has no
# `workflows` permission, so this file must be added via the GitHub web UI.
# The gradle-wrapper.jar is BINARY and cannot travel via snapshot push, so
# this workflow provisions Gradle 8.11.1 itself and builds with `gradle`
# (not ./gradlew). Once the jar exists in the repo, ./gradlew also works.
name: Build DevxyzClone APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # setup-android@v3 is broken on current runners (its sdkmanager
      # --licenses step crashes on cmdline-tools 16.0) — install directly
      # with the runner's preinstalled sdkmanager instead.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | $SDKMANAGER --licenses > /dev/null || true
          $SDKMANAGER "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DevxyzClone-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
